<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Longmeadow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>551 Longmeadow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0A0A0B; --panel:#131315; --panel2:#1A1A1D; --line:#2A2A2F; --line2:#3A3A40;
  --text:#EDEDEF; --muted:#8B8B93; --dim:#5E5E66; --white:#FFFFFF; --ink:#0A0A0B;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 96px;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:22px 18px;border-bottom:1px solid var(--line)}
.brand .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1;margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance}
.brand h1 i{color:var(--muted)}
.today-date{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.banner{margin-top:12px;font-size:13px;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r);padding:8px 12px}
section.view{display:flex;flex-direction:column;gap:22px;padding-top:22px}
h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
h3{font-size:12px;font-family:var(--mono);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--panel);padding:14px 14px 12px;display:flex;flex-direction:column;gap:2px}
.stat .n{font-family:var(--serif);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat .n small{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:2px}
.stat .l{font-size:12px;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)} .brand h1{font-size:30px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--sans);color:var(--muted);background:transparent;border:1px solid var(--line2);border-radius:999px;padding:5px 11px;cursor:pointer;transition:all .15s}
.chip:hover{color:var(--text);border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--white);color:var(--ink);border-color:var(--white)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--white);outline-offset:2px}
.btn{font:600 13px var(--sans);background:var(--white);color:var(--ink);border:1px solid var(--white);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
input[type=text],input[type=number],select{font:500 14px var(--sans);color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;min-width:0}
input[type=number]{width:64px;font-family:var(--mono);font-size:13px}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.box{width:22px;height:22px;border:1.5px solid var(--muted);border-radius:6px;display:grid;place-items:center;flex:none}
button.box{background:transparent;padding:0;cursor:pointer;color:inherit}
.box.on{background:var(--white);border-color:var(--white)}
.box.on::after{content:"";width:10px;height:6px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
.prayers{display:flex;flex-direction:column}
.prayer{display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prayer:first-child{border-top:0;padding-top:0}
.prayer .name{font-family:var(--serif);font-size:21px}
.pill{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);color:var(--dim);border-radius:999px;padding:3px 8px;white-space:nowrap}
.pill.on{background:var(--white);color:var(--ink);border-color:var(--white)}
.pill.warn{border-color:var(--text);color:var(--text)}
@media (max-width:560px){.prayer{grid-template-columns:1fr auto}.prayer .chips{grid-column:1/-1;order:3}}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .m{font-size:12.5px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1.5px solid var(--muted)}
.dot.clean{background:#2E2E33;border-color:#55555C}
.dot.due{background:#8C8C93;border-color:#8C8C93}
.dot.none{background:transparent;border-color:#3A3A40;border-style:dashed}
.dot.overdue{background:var(--white);border-color:var(--white);box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:rgba(10,10,11,.7);backdrop-filter:blur(6px)}
.seg button{font:500 12px var(--mono);color:var(--muted);background:transparent;border:0;padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font:500 11px var(--mono);color:var(--dim);letter-spacing:.06em;pointer-events:none}
.sheet{border:1px solid var(--white);border-radius:var(--r);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:30px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:13.5px;white-space:nowrap}
th{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:13px}
.scroll{overflow-x:auto}
table.weeks tr[data-a]{cursor:pointer}table.weeks tr[data-a]:hover td{background:var(--panel2)}
table.weeks tr.sel td{background:var(--panel2)}table.weeks tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--white)}
table.weeks .m{font-size:12px;color:var(--muted);font-weight:400}
table.rota th{white-space:normal;min-width:92px;vertical-align:bottom;line-height:1.35}
table.rota td{font-size:13px}
table.rota td:first-child,table.rota th:first-child{position:sticky;left:0;background:var(--panel);z-index:1;padding-right:14px}
table.rota tr.cur td{background:var(--white);color:var(--ink)}
table.rota tr.cur td:first-child{border-radius:6px 0 0 6px}table.rota tr.cur td:last-child{border-radius:0 6px 6px 0}
.ptag{display:inline-block;font:500 10px var(--mono);border:1px solid var(--line2);border-radius:4px;padding:0 4px;color:var(--muted);letter-spacing:0}
.hchip{display:inline-block;margin-top:6px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--white);color:var(--ink);border-radius:999px;padding:3px 9px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--white)}
.editrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.editrow:first-of-type{border-top:0}
.editrow label{font:500 10px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.08em;display:flex;flex-direction:column;gap:3px}
.editrow input[type=text]{flex:1;min-width:140px}
.x{background:none;border:1px solid var(--line2);color:var(--muted);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px;align-self:flex-end}
.x:hover{color:var(--text);border-color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,10,11,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{background:none;border:0;color:var(--dim);font:600 12px var(--sans);padding:8px 2px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
nav.tabs button[aria-current="page"]{color:var(--white)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--white);color:var(--ink);font-weight:600;font-size:13px;padding:9px 14px;border-radius:8px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.empty{color:var(--muted);font-size:13.5px}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav .lbl{font-family:var(--mono);font-size:12.5px;color:var(--muted);min-width:150px;text-align:center}
/* motion: quiet, linear-feeling, no overshoot */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes fillIn{from{background-color:transparent;border-color:var(--muted)}to{background-color:var(--white);border-color:var(--white)}}
@keyframes fillOut{from{background-color:var(--white);border-color:var(--white)}to{background-color:transparent;border-color:var(--muted)}}
@keyframes chipIn{from{background-color:transparent;color:var(--muted);border-color:var(--line2)}to{background-color:var(--white);color:var(--ink);border-color:var(--white)}}
@keyframes chipOut{from{background-color:var(--white);color:var(--ink);border-color:var(--white)}to{background-color:transparent;color:var(--muted);border-color:var(--line2)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
:root{--ease:cubic-bezier(.25,.1,.25,1)}
section.view.anim>*{animation:rise .36s var(--ease) both}
section.view.anim>*:nth-child(2){animation-delay:.04s}section.view.anim>*:nth-child(3){animation-delay:.08s}
section.view.anim>*:nth-child(4){animation-delay:.12s}section.view.anim>*:nth-child(n+5){animation-delay:.16s}
.anim .bar i{transform-origin:left;animation:grow .6s var(--ease) .15s both}
/* left-to-right fill on tap */
@keyframes wipeIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sweep{0%{transform:scaleX(0);opacity:1}55%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes inkIn{0%,35%{color:var(--muted)}100%{color:var(--ink)}}
@keyframes inkOut{0%,35%{color:var(--ink)}100%{color:var(--muted)}}
@keyframes inkFlash{0%{color:var(--text)}30%,60%{color:var(--ink)}100%{color:var(--text)}}
.chip.pop,.box.pop,.pop .box,.btn.ghost.pop{position:relative;overflow:hidden;isolation:isolate}
.chip.pop::before,.box.pop::before,.pop .box::before,.btn.ghost.pop::before{content:"";position:absolute;inset:0;background:var(--white);z-index:-1;transform-origin:left center}
.chip.pop[aria-pressed="true"]{background:transparent;animation:inkIn .3s var(--ease) both}
.chip.pop[aria-pressed="true"]::before{animation:wipeIn .3s var(--ease) both}
.chip.pop[aria-pressed="false"]{animation:inkOut .3s var(--ease) both}
.chip.pop[aria-pressed="false"]::before{transform-origin:right center;animation:wipeIn .3s var(--ease) reverse both}
.box.pop.on,.pop .box.on{background:transparent}
.box.pop.on::before,.pop .box.on::before{animation:wipeIn .26s var(--ease) both}
.box.pop.on::after,.pop .box.on::after{position:relative;z-index:1;animation:draw .2s var(--ease) .2s both}
.box.pop:not(.on)::before,.pop .box:not(.on)::before{transform-origin:right center;animation:wipeIn .26s var(--ease) reverse both}
.btn.ghost.pop{animation:inkFlash .5s var(--ease) both}
.btn.ghost.pop::before{animation:sweep .5s var(--ease) both}
.chip,.btn,.box,.x,.item,.pill,nav.tabs button{transition:background-color .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease),opacity .18s var(--ease)}
.btn:hover{opacity:.88}
.card{transition:border-color .2s var(--ease)}
.card:hover{border-color:var(--line2)}
.toast:not([hidden]){animation:toastIn .22s var(--ease) both}
nav.tabs button{position:relative}
nav.tabs button::before{content:"";position:absolute;top:-7px;left:50%;height:1px;width:0;background:var(--white);transform:translateX(-50%);transition:width .25s var(--ease)}
nav.tabs button[aria-current="page"]::before{width:24px}
header.top{animation:fadeIn .4s var(--ease) both}
.card{background:linear-gradient(180deg,#151518 0%,var(--panel) 60%)}
.stat{transition:background-color .2s var(--ease)}.stat:hover{background:var(--panel2)}
/* istişare */
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
textarea{font:500 14px/1.55 var(--sans);color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:10px;resize:vertical;min-height:96px}
input[type=date]{font:500 14px var(--sans);color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;max-width:220px}
textarea:focus,input:focus,select:focus{border-color:var(--muted);outline:none}
.notes{color:var(--text);font-size:14px;line-height:1.65;border-left:2px solid var(--line2);padding-left:12px}
.chip.static{cursor:default;font-size:12px;padding:3px 9px}
.chip.static:hover{color:var(--muted);border-color:var(--line2)}
.done-t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--dim)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Hizmet evi · Longmeadow, MA</div>
      <h1>551 Longmeadow <i>St.</i></h1>
    </div>
    <div class="today-date" id="todayDate"></div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main id="app"></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script>
(function(){
"use strict";

/* ---------- defaults (used until the house setup is saved) ---------- */
const DEFAULT_CONFIG = {
  residents:[{id:"r1",name:"Yusuf"},{id:"r2",name:"Ali"},{id:"r3",name:"Emre"},{id:"r4",name:"Mustafa Can"},{id:"r5",name:"Ahmet Asim"},{id:"r6",name:"Muhammad Abi"}],
  prayers:["sabah","aksam","yatsi"],
  floors:[{n:0,name:"Ground"},{n:1,name:"Upstairs"}],
  rooms:[
    {id:"living",name:"Living room",floor:0,x:0,z:0,w:5,d:4,every:7},
    {id:"kitchen",name:"Kitchen",floor:0,x:5,z:0,w:5,d:4,every:1},
    {id:"dining",name:"Dining room",floor:0,x:0,z:4,w:4,d:4,every:3},
    {id:"hall0",name:"Entry & hall",floor:0,x:4,z:4,w:3,d:4,every:7},
    {id:"bath0",name:"Half bath",floor:0,x:7,z:4,w:3,d:2,every:3},
    {id:"laundry",name:"Laundry",floor:0,x:7,z:6,w:3,d:2,every:14},
    {id:"bed1",name:"Bedroom 1",floor:1,x:0,z:0,w:4,d:4,every:7},
    {id:"hall1",name:"Upstairs hall",floor:1,x:4,z:0,w:2,d:8,every:7},
    {id:"bed2",name:"Bedroom 2",floor:1,x:6,z:0,w:4,d:4,every:7},
    {id:"bed3",name:"Bedroom 3",floor:1,x:0,z:4,w:4,d:4,every:7},
    {id:"bath1",name:"Bathroom",floor:1,x:6,z:4,w:2,d:4,every:3},
    {id:"study",name:"Study room",floor:1,x:8,z:4,w:2,d:4,every:7}
  ],
  duties:[
    {id:"d1",title:"Kitchen & dishes",rotate:true},
    {id:"d2",title:"Bathrooms",rotate:true},
    {id:"d3",title:"Vacuum common areas",rotate:true},
    {id:"d4",title:"Trash & recycling",rotate:true}
  ]
};
const PRAYERS=[["sabah","Sabah"],["ogle","Öğle"],["ikindi","İkindi"],["aksam","Akşam"],["yatsi","Yatsı"]];
const DEFAULT_CEMAAT=["sabah","aksam","yatsi"];
const AP=()=>{const on=cfg().prayers||DEFAULT_CEMAAT;return PRAYERS.filter(([id])=>on.includes(id));};

/* ---------- state ---------- */
const S={recWeek:0,ist:{},istDraft:null,istConfirm:null,animate:true,config:null,days:{},rooms:{},weeks:{},notes:[],tab:"today",weekOffset:0,selRoom:null,floor:"all",live:false,cleanBy:null};
try{S.tab=localStorage.getItem("lm.tab")||"today";if(S.tab==="house")S.tab="istisare";S.cleanBy=localStorage.getItem("lm.me")||null;}catch(e){}

const cfg=()=>S.config||DEFAULT_CONFIG;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dkey(new Date());
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x;}
// Cleaning weeks run from Monday 11 PM to the next Monday 11 PM (cleaning is usually done Sunday–Monday).
function cleanStart(off){const m=monday(new Date(Date.now()-23*36e5));m.setDate(m.getDate()+7*(off||0));return m;}
function cleanDue(m){const d=new Date(m);d.setDate(d.getDate()+7);d.setHours(23,0,0,0);return d;}
function dueText(d){const h=(d-Date.now())/36e5;if(h<=0)return "Overdue";if(h<24)return "Due tonight, 11 PM";if(h<48)return "Due tomorrow, 11 PM";return "Due "+d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+", 11 PM";}
function weekStart(off){const m=monday(new Date());m.setDate(m.getDate()+7*(off||0));return m;}
const EPOCH=new Date(2024,0,1); // a Monday
const weekIndex=m=>Math.round((m-EPOCH)/(7*864e5));
function parseKey(k){const [y,mo,d]=k.split("-").map(Number);return new Date(y,mo-1,d);}
function cycleLen(){const t=cfg().rotaTable;return t&&t.length?t.length:Math.max(1,cfg().residents.length);}
function hafta(m){const a=cfg().rotaAnchor?parseKey(cfg().rotaAnchor):EPOCH;const n=cycleLen();const w=weekIndex(m)-weekIndex(a);return ((w%n)+n)%n+1;}
const resName=id=>{const r=cfg().residents.find(r=>r.id===id);return r?r.name:"Someone";};
const fmtDay=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});};
function ago(iso){if(!iso)return "never";const h=(Date.now()-new Date(iso))/36e5;if(h<1)return "just now";if(h<24)return Math.floor(h)+"h ago";const d=Math.floor(h/24);return d===1?"yesterday":d+" days ago";}

let toastT;function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=true;void t.offsetWidth;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200);}

/* ---------- server (Supabase) ---------- */
const CONF=window.LEDGER_CONFIG||{};
let PASS=null;try{PASS=localStorage.getItem("lm.pass");}catch(_){}
function headers(){const h={"Content-Type":"application/json",apikey:CONF.supabaseKey};if(String(CONF.supabaseKey||"").startsWith("eyJ"))h.Authorization="Bearer "+CONF.supabaseKey;return h;}
async function rpc(fn,body){
  let res;
  try{res=await fetch(CONF.supabaseUrl.replace(/\/(rest\/v1\/?)?$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:headers(),body:JSON.stringify(Object.assign({p_pass:PASS},body||{}))});}
  catch(e){const x=new Error("no connection");x.status=0;throw x;}
  if(!res.ok){const t=await res.text();const e=new Error(t);e.status=res.status;e.wrongPass=/wrong passcode/i.test(t);throw e;}
  const t=await res.text();return t?JSON.parse(t):null;
}
function deepMerge(a,b){if(!a||typeof a!=="object"||Array.isArray(a)||!b||typeof b!=="object"||Array.isArray(b))return b;const o=Object.assign({},a);for(const k in b)o[k]=deepMerge(a[k],b[k]);return o;}
const chains={};
function queue(path,fn){chains[path]=(chains[path]||Promise.resolve()).then(fn).catch(e=>{toast(e&&e.wrongPass?"The house passcode has changed. Reopen the site and enter the new one.":"Couldn't save. Check the connection and try again.");});}
function save(path,data){queue(path,()=>rpc("ledger_write",{p_path:path,p_data:data}));}
function patch(path,partial){queue(path,()=>rpc("ledger_merge",{p_path:path,p_data:partial}));}
function del(path){queue(path,()=>rpc("ledger_delete",{p_path:path}));}

/* ---------- derived ---------- */
function dayDoc(k){return S.days[k]||{date:k,reading:{done:false,book:"",attendees:[]},prayers:{}};}
function roomStatus(room){
  if(!room.every)return {s:"none",days:null};
  const st=S.rooms[room.id];const last=st&&st.last;
  if(!last)return {s:"overdue",days:null};
  const days=(Date.now()-new Date(last))/864e5;const f=Math.max(1,room.every||7);
  return {s:days<f?"clean":days<2*f?"due":"overdue",days};
}
function dutyAssignee(duty,idx,monDate){
  const R=cfg().residents;if(!R.length)return null;
  if(!duty.rotate&&duty.fixed)return duty.fixed;
  const T=cfg().rotaTable;if(T&&T.length){const row=T[(hafta(monDate)-1)%T.length];if(row&&row[duty.id])return row[duty.id];}
  return R[((idx+hafta(monDate)-1)%R.length+R.length)%R.length].id;
}
function weekKey(m){return dkey(m);}
// A duty with "alternate" switches between two jobs week by week; the order flips each cycle so everyone gets both.
function altIndex(m){const a=cfg().rotaAnchor?parseKey(cfg().rotaAnchor):EPOCH;const w=weekIndex(m)-weekIndex(a);const n=cycleLen();const cyc=Math.floor(w/n);return (((hafta(m)-1+cyc)%2)+2)%2;}
function dutyTitle(du,m){return du.alternate&&du.alternate.length===2?du.alternate[altIndex(m)]:du.title;}
function weekDoc(k){return S.weeks[k]||{start:k,done:{}};}
const held=x=>!!(x&&x.reading&&(x.reading.done||x.reading.istisare));
function readingStreak(){
  let n=0;const d=new Date();
  const t=dayDoc(dkey(d));if(!held(t))d.setDate(d.getDate()-1);
  for(;;){const x=S.days[dkey(d)];if(held(x)){n++;d.setDate(d.getDate()-1);}else break;}
  return n;
}
function weekDays(m){const out=[];for(let i=0;i<7;i++){const d=new Date(m);d.setDate(d.getDate()+i);out.push(dkey(d));}return out;}
function cemaatCount(k){const p=dayDoc(k).prayers||{};return AP().filter(([id])=>(p[id]||[]).length>=2).length;}

function overdueCleanings(){
  const D=cfg().duties;if(!D.length)return 0;
  const start=cfg().rotaAnchor||weekKey(cleanStart(0));let n=0;
  for(let o=-1;o>=-12;o--){const m=cleanStart(o);if(weekKey(m)<start)break;const wd=weekDoc(weekKey(m));
    D.forEach(du=>{if(!(wd.done&&wd.done[du.id]))n++;});}
  return n;
}

function weekSummary(off){
  const m=weekStart(off),end=new Date(m);end.setDate(end.getDate()+6);
  const days=weekDays(m).filter(k=>k<=today());
  const reading=days.filter(k=>{const x=S.days[k];return held(x);}).length;
  const ist=days.find(k=>{const x=S.days[k];return x&&x.reading&&x.reading.istisare;});
  const cem=days.reduce((a,k)=>a+cemaatCount(k),0);
  const wd=weekDoc(weekKey(m));const D=cfg().duties;
  const rows=D.map((du,i)=>({who:dutyAssignee(du,i,m),done:wd.done&&wd.done[du.id]}));
  const done=rows.filter(x=>x.done).length;
  const missed=[...new Set(rows.filter(x=>!x.done&&x.who).map(x=>resName(x.who)))];
  return {m,end,ist,days:days.length,reading,cem,max:7*AP().length,done,total:D.length,missed,current:off===0};
}

}

let draft=null;
function draftHafta(){const a=draft.rotaAnchor?parseKey(draft.rotaAnchor):EPOCH;const n=Math.max(1,draft.residents.length);const w=weekIndex(weekStart(0))-weekIndex(a);return ((w%n)+n)%n+1;}
function chipsP(){const on=draft.prayers||DEFAULT_CEMAAT;return `<div class="chips">${PRAYERS.map(([id,n])=>`<button class="chip" data-a="togPrayer" data-id="${id}" aria-pressed="${on.includes(id)}">${n}</button>`).join("")}</div>`;}
function viewSetup(){
  if(!draft)draft=JSON.parse(JSON.stringify(cfg()));
  const fl=draft.floors;
  return `<section class="view">
    <div class="row spread"><div><h2>Setup</h2><p class="sub">Residents, prayers and cleaning duties.</p></div><div class="row"><button class="btn ghost" data-a="resetDraft">Discard</button><button class="btn" data-a="saveSetup">Save setup</button></div></div>
    <div class="card"><h3>Prayers prayed in cemaat</h3><p class="sub" style="margin:0">Only these are tracked on the Today page and counted in the records.</p>${chipsP()}</div>
    <div class="card"><h3>Residents</h3>
      ${draft.residents.map((r,i)=>`<div class="editrow"><input type="text" id="res-${r.id}" data-f="res" data-i="${i}" value="${esc(r.name)}" aria-label="Resident name"><button class="x" data-a="rmRes" data-i="${i}" aria-label="Remove">×</button></div>`).join("")}
      <div><button class="btn ghost sm" data-a="addRes">Add resident</button></div>
    </div>
    <div class="card"><h3>Cleaning duties</h3>${draft.rotaTable&&draft.rotaTable.length?'<p class="sub" style="margin:0">Who does what each week follows the full rota on the Cleaning tab.</p>':""}
      ${draft.duties.map((du,i)=>`<div class="editrow"><input type="text" id="du-${du.id}" data-f="du" data-k="title" data-i="${i}" value="${esc(du.title)}" aria-label="Duty">
        ${draft.rotaTable&&draft.rotaTable.length?`<label>Puan<input type="number" min="0" id="du-pts-${du.id}" data-f="du" data-k="pts" data-i="${i}" value="${du.pts||0}"></label>`:`<label>Assigned<select id="du-as-${du.id}" data-f="du" data-k="assign" data-i="${i}"><option value="">Rotates weekly</option>${draft.residents.map(r=>`<option value="${r.id}" ${!du.rotate&&du.fixed===r.id?"selected":""}>Always ${esc(r.name)}</option>`).join("")}</select></label>`}
        <button class="x" data-a="rmDuty" data-i="${i}" aria-label="Remove">×</button></div>`).join("")}
      <div><button class="btn ghost sm" data-a="addDuty">Add duty</button></div>
    </div>
  </section>`;
}

function render(){
  renderTabs();
  $("#todayDate").innerHTML=new Date().toLocaleDateString("en-GB",{weekday:"long"})+"<br>"+new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})+(cfg().duties.length?`<br><span class="hchip">Hafta ${hafta(cleanStart(0))}</span>`:"");
  const app=$("#app");
  const v={today:viewToday,istisare:viewIstisare,vazife:viewVazife,records:viewRecords,setup:viewSetup}[S.tab]||viewToday;
  const focusId=document.activeElement&&document.activeElement.id;
  const html=v();
  // Skip identical re-renders (e.g. the save echoing back) so running animations aren't cut off.
  if(html===lastHtml&&!S.animate&&!popSel&&app.firstElementChild)return;
  lastHtml=html;app.innerHTML=html;
  if(focusId&&document.getElementById(focusId)&&S.tab!=="today")document.getElementById(focusId).focus();
  const sec=app.firstElementChild;
  if(S.animate&&sec){sec.classList.add("anim");countUp(sec);S.animate=false;}
  if(popSel){try{const el=app.querySelector(popSel);if(el)el.classList.add("pop");}catch(_){}popSel=null;}
}
let popSel=null,lastHtml="";
function countUp(root){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  root.querySelectorAll(".stat .n").forEach(n=>{const tn=n.firstChild;if(!tn||tn.nodeType!==3)return;const to=parseInt(tn.nodeValue,10);if(!(to>0))return;
    const t0=performance.now();tn.nodeValue="0";
    const step=t=>{const p=Math.min(1,(t-t0)/500);tn.nodeValue=String(Math.round(to*(1-Math.pow(1-p,2))));if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);});
}
function fmtLong(k){const d=parseKey(k);return d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});}
function istList(){return Object.values(S.ist||{}).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.at).localeCompare(String(a.at)));}
function viewIstisare(){
  const list=istList(),dr=S.istDraft,open=[];
  list.forEach(m=>(m.decisions||[]).forEach(d=>{if(!d.done)open.push({m,d});}));
  return `<section class="view">
    <div class="row spread"><div><h2>İstişare</h2><p class="sub">Each istişare, what was decided, and who is following up.</p></div>${dr?"":'<button class="btn" data-a="istNew">New istişare</button>'}</div>
    ${dr?istForm(dr):""}
    <div class="card"><div class="row spread"><h3>Open decisions</h3><span class="pill ${open.length?"warn":"on"}">${open.length?open.length+" open":"All done"}</span></div>
      <div class="list">${open.length?open.map(({m,d})=>`<div class="item"><button class="box" data-a="decToggle" data-id="${m.id}" data-d="${d.id}" aria-label="Mark done"></button><div class="grow"><div class="t" style="font-weight:500">${esc(d.text)}</div><div class="m">${d.owner?esc(resName(d.owner)):"No one assigned"} · decided ${esc(fmtDay(m.date))}</div></div></div>`).join(""):'<div class="empty">Nothing waiting on anyone.</div>'}</div></div>
    ${list.length?list.map(meetingCard).join(""):'<div class="card"><div class="empty">No istişare recorded yet. Tap “New istişare” after your next one.</div></div>'}
  </section>`;
}
function meetingCard(m){
  const ds=m.decisions||[],done=ds.filter(d=>d.done).length,att=m.attendees||[],conf=S.istConfirm===m.id;
  return `<div class="card"><div class="row spread" style="align-items:flex-start"><div><h2 style="font-size:24px">${esc(fmtLong(m.date))}</h2><div class="sub">${att.length?att.length+" took part · ":""}${ds.length?done+" of "+ds.length+" decisions done":"No decisions recorded"}</div></div>
    <div class="row">${conf?`<span class="sub" style="margin:0">Delete this record?</span><button class="btn sm" data-a="istDel" data-id="${m.id}">Delete</button><button class="btn ghost sm" data-a="istDelNo">Keep</button>`:`<button class="btn ghost sm" data-a="istEdit" data-id="${m.id}">Edit</button><button class="x" style="width:30px;height:30px" data-a="istDelAsk" data-id="${m.id}" aria-label="Delete">×</button>`}</div></div>
    ${m.notes?`<div class="notes">${esc(m.notes).replace(/\n/g,"<br>")}</div>`:""}
    ${ds.length?`<div class="list">${ds.map(d=>`<div class="item"><button class="box ${d.done?"on":""}" data-a="decToggle" data-id="${m.id}" data-d="${d.id}" aria-label="Toggle done"></button><div class="grow"><div class="t ${d.done?"done-t":""}" style="font-weight:500">${esc(d.text)}</div><div class="m">${d.owner?esc(resName(d.owner)):"No one assigned"}${d.done&&d.doneAt?" · done "+ago(d.doneAt):""}</div></div></div>`).join("")}</div>`:""}
    ${att.length?`<div class="chips">${att.map(id=>`<span class="chip static">${esc(resName(id))}</span>`).join("")}</div>`:""}
  </div>`;
}
function istForm(dr){
  return `<div class="card sheet">
    <h3>${dr.id?"Edit istişare":"New istişare"}</h3>
    <label class="field"><span>Date</span><input type="date" id="istDate" data-f="ist" data-k="date" value="${esc(dr.date)}"></label>
    <div class="field"><span>Who took part</span>${chips(null,dr.attendees,"istAtt")}</div>
    <label class="field"><span>Notes</span><textarea id="istNotes" data-f="ist" data-k="notes" rows="4" placeholder="What was discussed">${esc(dr.notes)}</textarea></label>
    <div class="field"><span>Decisions</span>
      ${dr.decisions.map((d,i)=>`<div class="editrow"><input type="text" id="dec-${d.id}" data-f="dec" data-k="text" data-i="${i}" value="${esc(d.text)}" placeholder="What was decided"><select id="deco-${d.id}" data-f="dec" data-k="owner" data-i="${i}"><option value="">Who follows up</option>${cfg().residents.map(r=>`<option value="${r.id}" ${d.owner===r.id?"selected":""}>${esc(r.name)}</option>`).join("")}</select><button class="x" data-a="decRm" data-i="${i}" aria-label="Remove decision">×</button></div>`).join("")}
      <div><button class="btn ghost sm" data-a="decAdd">Add decision</button></div></div>
    <div class="row"><button class="btn" data-a="istSave">Save istişare</button><button class="btn ghost" data-a="istCancel">Cancel</button></div>
  </div>`;
}

/* ---------- actions ---------- */
function patchDay(k,partial){partial.date=k;S.days[k]=deepMerge(dayDoc(k),partial);patch("days/"+k,partial);render();}
function markIstDay(k){patchDay(k,{reading:{istisare:true}});}
function toggleIn(arr,id){const i=arr.indexOf(id);if(i>=0)arr.splice(i,1);else arr.push(id);return arr;}
function markRooms(duty,by){(duty.rooms||[]).forEach(rid=>{const s=JSON.parse(JSON.stringify(S.rooms[rid]||{history:[]}));const at=new Date().toISOString();s.last=at;s.by=by;s.history=(s.history||[]).concat([{at,by}]).slice(-40);S.rooms[rid]=s;save("roomstate/"+rid,s);});}
function dutyWho(id,wk){const m=parseKey(wk);const i=cfg().duties.findIndex(d=>d.id===id);return i<0?null:dutyAssignee(cfg().duties[i],i,m);}
function setWeekDuty(wk,id,val){if(val){const du=cfg().duties.find(d=>d.id===id);const who=dutyWho(id,wk);if(du&&who){val.by=who;markRooms(du,who);}}const part={start:wk,done:{[id]:val||null}};S.weeks[wk]=deepMerge(weekDoc(wk),part);patch("weeks/"+wk,part);render();}
const uid=p=>p+Math.random().toString(36).slice(2,8);

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-a]");if(!t)return;
  if(t.dataset.tab){if(S.tab!==t.dataset.tab)S.animate=true;S.tab=t.dataset.tab;try{localStorage.setItem("lm.tab",S.tab);}catch(_){}render();window.scrollTo(0,0);return;}
  const a=t.dataset.a,id=t.dataset.id,k=today();
  popSel=["a","id","p","w","d"].filter(x=>t.dataset[x]!=null).map(x=>`[data-${x}="${CSS.escape(t.dataset[x])}"]`).join("");
  switch(a){
    case "istNew":S.istDraft={date:today(),attendees:cfg().residents.map(r=>r.id),notes:"",decisions:[{id:uid("d"),text:"",owner:"",done:false}]};S.animate=true;render();window.scrollTo({top:0,behavior:"smooth"});break;
    case "istEdit":{const m=S.ist[id];if(!m)return;const c=JSON.parse(JSON.stringify(m));S.istDraft={id,date:c.date,attendees:c.attendees||[],notes:c.notes||"",decisions:c.decisions||[],at:c.at};S.animate=true;render();window.scrollTo({top:0,behavior:"smooth"});break;}
    case "istCancel":S.istDraft=null;render();break;
    case "istAtt":toggleIn(S.istDraft.attendees,id);render();break;
    case "decAdd":{const nd={id:uid("d"),text:"",owner:"",done:false};S.istDraft.decisions.push(nd);render();const el=document.getElementById("dec-"+nd.id);if(el)el.focus();break;}
    case "decRm":S.istDraft.decisions.splice(Number(t.dataset.i),1);render();break;
    case "istSave":{const dr=S.istDraft;if(!dr.date){toast("Choose a date first");return;}
      const doc={date:dr.date,attendees:dr.attendees.slice(),notes:(dr.notes||"").trim(),decisions:dr.decisions.filter(d=>(d.text||"").trim()).map(d=>Object.assign({},d,{text:d.text.trim()})),at:dr.at||new Date().toISOString()};
      const nid=dr.id||uid("i");S.ist[nid]=Object.assign({id:nid},doc);save("istisare/"+nid,doc);S.istDraft=null;
      const day=dayDoc(dr.date);if(!(day.reading&&day.reading.istisare))markIstDay(dr.date);
      S.animate=true;render();toast("İstişare saved");break;}
    case "decToggle":{const m=S.ist[id];if(!m)return;const c=JSON.parse(JSON.stringify(m));const d=(c.decisions||[]).find(x=>x.id===t.dataset.d);if(!d)return;d.done=!d.done;d.doneAt=d.done?new Date().toISOString():null;
      S.ist[id]=c;const doc=Object.assign({},c);delete doc.id;save("istisare/"+id,doc);render();if(d.done)toast("Decision done");break;}
    case "istDelAsk":S.istConfirm=id;render();break;
    case "istDelNo":S.istConfirm=null;render();break;
    case "istDel":delete S.ist[id];S.istConfirm=null;del("istisare/"+id);render();toast("İstişare deleted");break;
    case "readIst":patchDay(k,{reading:{istisare:!((dayDoc(k).reading||{}).istisare)}});break;
    case "readDone":patchDay(k,{reading:{done:!((dayDoc(k).reading||{}).done)}});break;
    case "readAtt":patchDay(k,{reading:{attendees:toggleIn(((dayDoc(k).reading||{}).attendees||[]).slice(),id)}});break;
    case "pray":{const p=t.dataset.p;patchDay(k,{prayers:{[p]:toggleIn(((dayDoc(k).prayers||{})[p]||[]).slice(),id)}});break;}
    case "goRoom":S.selRoom=id;if(S.tab!=="house"){S.tab="house";try{localStorage.setItem("lm.tab","house");}catch(_){}}render();setTimeout(()=>{const sh=$("#sheet");sh&&sh.scrollIntoView({behavior:"smooth",block:"nearest"});},50);break;
    case "closeSheet":S.selRoom=null;render();break;
    case "cleanBy":S.cleanBy=S.cleanBy===id?null:id;try{localStorage.setItem("lm.me",S.cleanBy||"");}catch(_){}render();break;
    case "markClean":{if(!S.cleanBy)return;const s=JSON.parse(JSON.stringify(S.rooms[id]||{history:[]}));const at=new Date().toISOString();s.last=at;s.by=S.cleanBy;s.history=(s.history||[]).concat([{at,by:S.cleanBy}]).slice(-40);S.rooms[id]=s;save("roomstate/"+id,s);toast("Recorded: "+(cfg().rooms.find(r=>r.id===id)||{}).name+" cleaned");render();break;}
    case "undoClean":{const s=JSON.parse(JSON.stringify(S.rooms[id]||{history:[]}));s.history=(s.history||[]).slice(0,-1);const l=s.history[s.history.length-1];s.last=l?l.at:null;s.by=l?l.by:null;S.rooms[id]=s;save("roomstate/"+id,s);render();break;}
    case "recWeek":S.recWeek=Number(t.dataset.o);render();break;
    case "wk":S.weekOffset+=Number(t.dataset.d);render();break;
    case "dutyToggle":{const wd=weekDoc(t.dataset.w);setWeekDuty(t.dataset.w,id,wd.done&&wd.done[id]?null:{at:new Date().toISOString()});break;}
    case "dutyDone":setWeekDuty(t.dataset.w,id,{at:new Date().toISOString()});toast("Cleaning marked done");break;
    case "noteDone":{const n=S.notes.find(n=>n.id===id);if(n){n.done=true;save("notes/"+id,{text:n.text,at:n.at,done:true});render();}break;}
    case "togPrayer":{const on=(draft.prayers||DEFAULT_CEMAAT).slice();const i=on.indexOf(id);if(i>=0){if(on.length===1){toast("Keep at least one prayer");return;}on.splice(i,1);}else on.push(id);draft.prayers=PRAYERS.map(p=>p[0]).filter(x=>on.includes(x));render();break;}
    case "copyRota":{const txt=$("#rotaText").textContent;const ok=()=>toast("Copied. Paste it into the house group.");try{navigator.clipboard.writeText(txt).then(ok,()=>{const sel=getSelection();sel.selectAllChildren($("#rotaText"));toast("Selected. Copy it from the menu.");});}catch(_){const sel=getSelection();sel.selectAllChildren($("#rotaText"));toast("Selected. Copy it from the menu.");}break;}
    case "setHafta":break;
    case "addRes":draft.residents.push({id:uid("r"),name:"New resident"});render();break;
    case "rmRes":draft.residents.splice(Number(t.dataset.i),1);render();break;
    case "addFloor":{const n=draft.floors.length?Math.max(...draft.floors.map(f=>f.n))+1:0;draft.floors.push({n,name:"Floor "+n});render();break;}
    case "rmFloor":{const f=draft.floors[Number(t.dataset.i)];if(draft.rooms.some(r=>r.floor===f.n)){toast("Move or remove that floor's rooms first");return;}draft.floors.splice(Number(t.dataset.i),1);render();break;}
    case "addRoom":draft.rooms.push({id:uid("rm"),name:"New room",floor:(draft.floors[0]||{n:0}).n,x:0,z:0,w:3,d:3,every:7});render();break;
    case "rmRoom":draft.rooms.splice(Number(t.dataset.i),1);render();break;
    case "addDuty":draft.duties.push({id:uid("d"),title:"New duty",rotate:true});render();break;
    case "rmDuty":draft.duties.splice(Number(t.dataset.i),1);render();break;
    case "resetDraft":draft=null;render();toast("Changes discarded");break;
    case "saveSetup":{
      if(!draft.residents.length){toast("Add at least one resident");return;}
      draft.residents.forEach(r=>{r.name=(r.name||"").trim()||"Unnamed";});
      S.config=JSON.parse(JSON.stringify(draft));save("house/config",S.config);draft=null;toast("Setup saved");render();break;}
  }
});
document.addEventListener("input",e=>{
  const ti=e.target;if(S.istDraft&&ti.dataset.f==="ist"){S.istDraft[ti.dataset.k]=ti.value;return;}
  if(S.istDraft&&ti.dataset.f==="dec"){S.istDraft.decisions[Number(ti.dataset.i)][ti.dataset.k]=ti.value;return;}
});
document.addEventListener("input",e=>{
  const t=e.target;if(!draft||!t.dataset.f)return;const i=Number(t.dataset.i);
  if(t.dataset.f==="res")draft.residents[i].name=t.value;
  else if(t.dataset.f==="fln")draft.floors[i].n=Number(t.value);
  else if(t.dataset.f==="hafta"){const m=weekStart(0);m.setDate(m.getDate()-7*(Number(t.value)-1));draft.rotaAnchor=dkey(m);}
  else if(t.dataset.f==="flname")draft.floors[i].name=t.value;
  else if(t.dataset.f==="rm"){const k=t.dataset.k;draft.rooms[i][k]=k==="name"?t.value:Number(t.value);if(k==="every")draft.rooms[i].every=Math.max(0,Number(t.value)||0);}
  else if(t.dataset.f==="du"){if(t.dataset.k==="title")draft.duties[i].title=t.value;else if(t.dataset.k==="pts")draft.duties[i].pts=Math.max(0,Number(t.value)||0);else{draft.duties[i].rotate=!t.value;draft.duties[i].fixed=t.value||null;}}
});
let bookT;
document.addEventListener("change",e=>{if(e.target.id==="book"){clearTimeout(bookT);const v=e.target.value;patchDay(today(),{reading:{book:v}});}});
document.addEventListener("submit",e=>{
  if(e.target.id!=="noteForm")return;e.preventDefault();
  const v=$("#noteText").value.trim();if(!v)return;
  const n={id:uid("n"),text:v,at:new Date().toISOString(),done:false};S.notes.unshift(n);save("notes/"+n.id,{text:n.text,at:n.at,done:false});render();
});

/* ---------- boot ---------- */
function ingest(rows){
  const days={},rooms={},weeks={},notes=[],ist={};let config=null;
  (rows||[]).forEach(x=>{const [c,id]=x.path.split("/");const d=x.data||{};
    if(x.path==="house/config")config=d;else if(c==="days")days[id]=d;else if(c==="roomstate")rooms[id]=d;else if(c==="weeks")weeks[id]=d;else if(c==="notes")notes.push(Object.assign({id},d));else if(c==="istisare")ist[id]=Object.assign({id},d);});
  notes.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  if(config)S.config=config;S.days=days;S.rooms=rooms;S.weeks=weeks;S.notes=notes;S.ist=ist;
}
function typing(){const a=document.activeElement;return a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName);}
function why(err){let w="";try{const j=JSON.parse(err.message);w=j.message||j.hint||"";}catch(_){w=String(err.message||"");}return (err.status?("error "+err.status+" – "):"no connection – ")+w.slice(0,160);}
let busy=false;
async function refresh(){
  if(busy||!PASS)return;busy=true;
  try{const rows=await rpc("ledger_read");ingest(rows);$("#banner").hidden=true;if(!typing()&&!draft&&!S.istDraft)render();}
  catch(e){if(e.wrongPass){PASS=null;try{localStorage.removeItem("lm.pass");}catch(_){}gate("That passcode didn't work.");}else{const b=$("#banner");b.hidden=false;b.textContent="Offline. Showing the last loaded records; changes will fail until the connection returns.";}}
  finally{busy=false;}
}
function gate(msg){
  $("#tabs").innerHTML="";
  $("#app").innerHTML=`<section class="view"><div class="card" style="max-width:420px">
    <h2>Enter the house passcode</h2><p class="sub" style="margin:0">Ask the ev imamı for it. You only need to enter it once on this phone.</p>
    <form class="row" id="passForm"><input type="password" id="passIn" autocomplete="current-password" placeholder="Passcode" style="flex:1"><button class="btn" type="submit">Open</button></form>
    ${msg?`<p class="sub" style="margin:0;color:var(--text)">${esc(msg)}</p>`:""}</div></section>`;
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="passForm")return;e.preventDefault();
  PASS=$("#passIn").value.trim();if(!PASS)return;
  try{const rows=await rpc("ledger_read");try{localStorage.setItem("lm.pass",PASS);}catch(_){}ingest(rows);render();}
  catch(err){PASS=null;gate(err.wrongPass?"That passcode didn't work.":"Couldn't reach the server. Details: "+why(err));}
});
if(!CONF.supabaseUrl||!CONF.supabaseKey){
  $("#app").innerHTML='<section class="view"><div class="card"><h2>Not connected yet</h2><p class="sub" style="margin:0">Fill in config.js with the Supabase project URL and key, then reload.</p></div></section>';
}else if(!PASS){gate("");}
else{render();refresh();}
setInterval(()=>{if(document.visibilityState==="visible")refresh();},15000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh();});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
